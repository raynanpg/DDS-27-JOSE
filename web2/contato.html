    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <header class="principal">
      <div class="logo">
        <h1>PixelForge Studios</h1>
        <p>Forjando mundos incríveis, um pixel de cada vez.</p>
      </div>
      <nav class="menu">
        <ul>
          <li>
            <a href="index.html" title="Home"
              ><span class="material-symbols-outlined">home</span></a
            >
          </li>
          <li>
            <a href="pagina2.html" title="Jogos"
              ><span class="material-symbols-outlined"
                >stadia_controller</span
              ></a
            >
          </li>
          <li>
            <a href="pagina3.html" title="imagem dos jogos"
              ><span class="material-symbols-outlined"> image </span></a
            >
          </li>
          <li>
            <a href="contato.html" title="Fale conosco"
              ><span class="material-symbols-outlined"> chat </span></a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section>
        <h1 class="titulo-contato">Fale Conosco</h1>
        <form
          class="formulario"
          onsubmit="
            window.open(
              'https://www.youtube.com/watch?v=pQzTBdeUNlU&autoplay=1',
              '_blank',
            );
            return false;
          "
        >
          <div class="inicio-contato">
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="boti seu nome"
              required
            />
          </div>

          <div class="inicio-contato">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="caralho@gmail.com"
              required
            />
          </div>

          <div class="inicio-contato">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              required
            />
          </div>

          <div class="inicio-contato">
            <label for="assunto">Assunto</label>
            <input
              type="text"
              id="assunto"
              name="assunto"
              placeholder="ta querendo oq?"
              required
            />
          </div>

          <div class="inicio-contato">
            <label for="mensagem">Mensagem</label>
            <textarea
              id="mensagem"
              name="mensagem"
              rows="5"
              placeholder="escreve a mensagem aq amigao, queridao, irmao e mais uns ao"
              required
            ></textarea>
          </div>

          <button type="submit" class="butao-contato">Enviar Mensagem</button>
        </form>
      </section>

      <footer id="final">
        <p>Email: PixelArt@gmail.com</p>
        <p>Telefone: 27970707070</p>
        <p>&copy;2026</p>
      </footer>
    </main>
  </body>
</html>
