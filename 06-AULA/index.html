<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- TABELA -->
    <header>
      <h1>Tabelas top</h1>
    </header>

    <main>
      <h2>PRODUTOS</h2>
      <!-- TABLE - CRIAÇÃO DA TABELA -->
      <!-- BORDER - PROPRIEDADES DE BORDA DA TABELA -->
      <table border="1">
        <!-- THEAD - CABEÇALHO DA TABELA -->
        <thead>
          <!-- TR - CRIAÇÃO DE UMA LINHA DA TABELA-->
          <tr>
            <!-- TH - COLUNA DE UM CABEÇALHO -->
            <th>ID</th>
            <th>NOME</th>
            <th>QUANTIDADE</th>
            <th>PREÇO</th>
            <th>CATEGORIA</th>
          </tr>
        </thead>
        <!-- TBODY - CORPO DA TABELA -->
        <tbody>
          <tr>
            <!-- TD - CÉLULA DA LINHA DO CORPO -->
            <td>1</td>
            <td>SHAMPOO CR7</td>
            <td>7</td>
            <td>R$ 77</td>
            <td>BELEZA</td>
          </tr>
            <td>2</td>
            <td>DORITOS</td>
            <td>10</td>
            <td>R$ 20</td>
            <td>ALIMENTO</td>
          </tr>
          </tr>
            <td>3</td>
            <!-- COLSPAN - DIZ QUANTAS COLUNAS A CÉLULA VAI OCUPAR -->
            <td colspan="3">MUCILON</td>
            <!-- ROWSPAN - DIZ QUANTAS LINHAS A CÉLULA VAI OCUPAR -->
            <td rowspan="2">FILHO</td>
          </tr>
          </tr>
            <td>4</td>
            <td>LAVADOR NASAL</td>
            <td>1</td>
            <td>R$ 30</td>
          </tr>

        </tbody>
        <!-- TFOOTE -  RODAPÉ DA TABELA -->
        <tfoot>
            <tr>
                <td colspan="5">TABELA FEITA POR: JOSE</td>
            </tr>
        </tfoot>
      </table>
    </main>

    <footer>
      <p>Segue noix</p>
    </footer>
  </body>
</html>
