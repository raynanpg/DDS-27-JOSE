<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>TRABALHANDO COM INPUTS</h1>
    </header>
    <!-- INPUT -->

    <main>
      <h2>Formulário de cadastro</h2>

      <!-- INPUT - COLETA DE INFORMAÇÕES -->

      <!--FORM -  ENGLOBAR O CAMPOS DO FORMULÁRIO -->
      <!-- ACTION - PARA ONDE VÃO AS INFORMAÇÕES PREENCHIDAS -->
      <!-- METHOD - FORMA DE COMO VÃO AS INFORMAÇÕES -->
      <form action="" method="">
        <!-- LABEL - TEXTO DE APOIO PARA GUIAR O INPUT -->
        <!-- LABEL SEM INPUT -->
        <label for="nomeCompleto">Nome completo:</label>
        <!-- TEXT - CARACTERES EM GERAL -->
        <!-- NAME - USADO PARA IDENTIFICAR O INPUT QUANDO ENVIAR OS DADOS -->
        <!-- ID - IDENTIFICAÇÃO DAWQUELE ELEMENTO HTML -->
        <input type="text" name="nomeCompleto" id="nomeCompleto">
        <br>
        <br>

        <!-- INPUT DENTRO DO LABEL -->
         <label for="">
            Senha:
            <!-- PASSWORD - SENHAS -->
            <input type="password" name="senha" id="senha">
         </label>
      </form>
    </main>

    <footer>
      <p>US DIREITOS SÃO MEUS PQ EU FIZ TUDO</p>
    </footer>
  </body>
</html>
