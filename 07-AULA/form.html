<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <!-- FILEDSET - SEGMENTA VISUALMENTE O FORMULARIO -->
      <fieldset>
        <!-- LEGEND - TITULO DO SEGMENTO -->
        <legend>Dados Pessoais</legend>

        <label for="nome"></label>
        <input type="text" name="nome" id="nome" />
        <!-- FIM CAIXINHA DE NOME -->

        <!-- CAIXINHA DATA DE NASCIMENTO -->
        <label for="">Data de nascimento:</label>
        <input type="text" name="" id="" />
        <!-- DATETIME-LOCAL - DATA E HORA JUNTOS -->
        <input type="datetime-local" />
        <!-- TIME - APENAS HORA -->
        <input type="time" />
        <!-- FIM DA CAIXINHA DATA DE NASCIMENTO -->
        <br />
        <br />
        <!-- CAIXINHA DE NÚMEROS -->
         <label for="">Quantidade de filhos:</label>
         <input type="number" name="filhos" id="filhos" min="0" max="69" step="0.7" value="5">
        <!-- FIM DA CAIXINHA DE NÚMEROS -->
      </fieldset>
    </form>
  </body>
</html>
